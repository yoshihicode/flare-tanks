<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>FLARE TANKS</title>
  <!-- PWA: install to the home screen (full screen on iPhone needs this, spec "スマホ対応の注意点") -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#121a14">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FLARE TANKS">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #121a14;   /* 夜の戦場 */
      --flare: #ffb347;   /* 照明弾の光 */
      --ash: #c9c4b3;     /* 文字色 */
    }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--night); color: var(--ash);
      font-family: "DotGothic16", "MS Gothic", monospace;
    }
    #c, #hud { position: absolute; inset: 0; margin: auto; }
    #c { image-rendering: pixelated; background: #000; cursor: crosshair; }
    #hud { pointer-events: none; } /* 文字だけを高解像度で重ねる。操作はその下の #c が受ける */
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1.25rem; background: rgba(18, 26, 20, 0.88);
      text-align: center; padding: 1rem; overflow-y: auto;
    }
    /* Short landscape phones: start from the top and scroll instead of clipping the lobby */
    @media (max-height: 480px) {
      #overlay { justify-content: flex-start; gap: 0.7rem; padding: 0.6rem 1rem; }
      #overlay h1 { font-size: 2.2rem; }
      #rooms { max-height: none; }
    }
    /* Touch: no text selection, callouts or double-tap zoom while playing */
    body.touch { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #c, #hud { touch-action: none; }
    .touch-only { display: none; }
    body.touch .touch-only { display: revert; }
    body.touch .mouse-only { display: none; }
    /* On-screen buttons for touch, at the top so thumbs don't cover them (spec: pin button up top) */
    #touchBar {
      position: absolute; top: calc(env(safe-area-inset-top) + 2.2rem); left: 50%; transform: translateX(-50%);
      display: none; gap: 0.5rem;
    }
    #touchBar .btn { padding: 0.45rem 0.9rem; background: rgba(10, 14, 11, 0.75); }
    /* On phones the settings panel sits below the button bar */
    body.touch #settings { top: calc(env(safe-area-inset-top) + 5.2rem); }
    /* Landscape only: ask to rotate a phone held upright */
    #rotate {
      position: fixed; inset: 0; display: none; z-index: 10; background: var(--night); color: var(--flare);
      flex-direction: column; gap: 0.5rem; align-items: center; justify-content: center; text-align: center;
      font-size: 1.3rem; padding: 2rem;
    }
    @media (orientation: portrait) { body.touch #rotate { display: flex; } }
    #overlay h1 {
      margin: 0; font-weight: 400; font-size: clamp(2.5rem, 9vw, 5rem);
      color: var(--flare); letter-spacing: 0.08em;
      text-shadow: 0 0 18px rgba(255, 179, 71, 0.55);
    }
    #msg { font-size: 1.1rem; }
    #help { font-size: 0.85rem; opacity: 0.75; line-height: 1.7; }
    #who { display: flex; gap: 0.5rem; align-items: center; }
    #who input {
      font: inherit; font-size: 1.1rem; color: var(--ash); background: rgba(0, 0, 0, 0.35);
      border: 2px solid #4a483e; padding: 0.3rem 0.6rem; width: 12em;
    }
    #who input:focus-visible { outline: 2px solid var(--flare); outline-offset: 2px; }
    #err { color: #ff8a7a; min-height: 1.2em; }
    #tanks { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    #tanks button {
      font: inherit; color: var(--ash); background: rgba(0, 0, 0, 0.35);
      border: 2px solid #4a483e; padding: 0.6rem 0.9rem; min-width: 9.5rem;
      cursor: pointer; text-align: left; line-height: 1.5;
    }
    #tanks button b { display: block; font-weight: 400; font-size: 1.1rem; color: var(--flare); }
    #tanks button small { opacity: 0.75; }
    #tanks button[aria-pressed="true"] { border-color: var(--flare); background: rgba(255, 179, 71, 0.12); }
    #tanks button:active, #tanks button[aria-busy="true"] { background: rgba(255, 179, 71, 0.3); }
    #tanks button:focus-visible { outline: 2px solid var(--flare); outline-offset: 2px; }
    /* Room settings panel: shown to the room owner while waiting */
    #settings {
      position: absolute; top: 3.2rem; right: 1rem; display: none;
      background: rgba(10, 14, 11, 0.9); border: 2px solid #4a483e; padding: 0.6rem 0.8rem;
      font-size: 0.9rem; min-width: 16rem;
    }
    #settings h2 { margin: 0 0 0.2rem; font-size: 1rem; font-weight: 400; color: var(--flare); }
    #settings select, #settings input { font: inherit; color: var(--ash); background: #1b2419; border: 1px solid #4a483e; }
    /* One setting per row: label on the left, a fixed-width control on the right, with space between rows */
    #createForm label, #settings label {
      display: grid; grid-template-columns: 1fr 11rem; align-items: center; column-gap: 1rem;
      margin: 0.4rem 0; line-height: 1.4;
    }
    #createForm select, #settings select, #createForm input[type="number"], #settings input[type="number"] {
      width: 100%; padding: 0.15rem 0.3rem; box-sizing: border-box; font: inherit; color: var(--ash);
      background: #1b2419; border: 1px solid #4a483e; text-align: left; letter-spacing: normal;
    }
    #createForm input[type="checkbox"], #settings input[type="checkbox"] { justify-self: start; width: 1.1rem; height: 1.1rem; margin: 0; }
    #settings select:focus-visible, #settings input:focus-visible { outline: 2px solid var(--flare); }
    /* Buttons and inputs in the title / lobby screens */
    .btn, #lobby input {
      font: inherit; color: var(--ash); background: rgba(0, 0, 0, 0.35); border: 2px solid #4a483e;
      padding: 0.35rem 0.8rem; cursor: pointer;
    }
    .btn.primary { border-color: var(--flare); color: var(--flare); }
    .btn:hover { background: rgba(255, 179, 71, 0.12); }
    .btn:active { transform: translateY(1px); background: rgba(255, 179, 71, 0.25); }
    /* A button whose action is in progress (joining can take a few seconds) */
    .btn[aria-busy="true"] {
      border-color: var(--flare); background: rgba(255, 179, 71, 0.3); color: #fff3c4; cursor: progress;
    }
    .btn:disabled:not([aria-busy="true"]) { opacity: 0.5; cursor: not-allowed; }
    @media (prefers-reduced-motion: no-preference) {
      .btn[aria-busy="true"] { animation: pulse 0.9s ease-in-out infinite; }
      @keyframes pulse { 50% { background: rgba(255, 179, 71, 0.12); } }
    }
    .btn:focus-visible, #lobby input:focus-visible { outline: 2px solid var(--flare); outline-offset: 2px; }
    #lobby { display: flex; flex-direction: column; gap: 0.9rem; width: min(40rem, 100%); cursor: default; }
    #lobby[hidden], #title[hidden], #createForm[hidden] { display: none; }
    #lobby .row { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; align-items: center; }
    #lobby input { cursor: text; width: 7em; text-align: center; letter-spacing: 0.15em; }
    #lobbyMsg { color: var(--flare); min-height: 1.2em; }
    #rooms { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow-y: auto; text-align: left; border-top: 2px solid #4a483e; }
    #rooms li { display: flex; justify-content: space-between; align-items: center; gap: 0.8rem; padding: 0.45rem 0.3rem; border-bottom: 1px solid #2c3328; }
    #rooms .meta { font-size: 0.85rem; opacity: 0.8; }
    #rooms .empty { justify-content: center; opacity: 0.7; }
    #createForm { border: 2px solid #4a483e; padding: 0.6rem 1rem; text-align: left; }
    #createForm select { font: inherit; color: var(--ash); background: #1b2419; border: 1px solid #4a483e; }
    #createForm .row { margin-top: 0.6rem; }
    #title { display: flex; flex-direction: column; align-items: center; gap: 1.25rem; }
    /* Players panel (Tab): invite code and kick */
    #players {
      position: absolute; top: 3.2rem; left: 1rem; display: none;
      background: rgba(10, 14, 11, 0.92); border: 2px solid #4a483e; padding: 0.6rem 0.8rem;
      font-size: 0.9rem; line-height: 1.9; min-width: 16rem;
    }
    #players h2 { margin: 0 0 0.3rem; font-size: 1rem; font-weight: 400; color: var(--flare); }
    #players ul { list-style: none; margin: 0.3rem 0; padding: 0; }
    #players li { display: flex; justify-content: space-between; gap: 1rem; }
    #players .A { color: #5ad1c8; } #players .B { color: #e8506a; }
    @media (prefers-reduced-motion: no-preference) {
      #overlay h1 { animation: flicker 3s infinite; }
      @keyframes flicker { 0%, 92%, 100% { opacity: 1 } 94% { opacity: 0.7 } 96% { opacity: 1 } 98% { opacity: 0.8 } }
    }
  </style>
</head>
<body>
  <canvas id="c" width="320" height="180"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
  <div id="overlay">
    <h1>FLARE TANKS</h1>
    <section id="title">
      <label id="who"><span data-i18n="title.name">名前</span> <input id="name" maxlength="12" autocomplete="nickname" placeholder="12文字まで" data-i18n-placeholder="title.namePlaceholder"></label>
      <button class="btn" id="langBtn" type="button" data-i18n="lang.switch">English</button>
      <div id="tanks" role="group" aria-label="戦車の選択" data-i18n-aria="title.tanks"></div>
      <div id="err" role="alert"></div>
      <div id="msg" data-i18n="title.msg">戦車を選んでロビーへ（1・2・3キーで選択、Enter で決定）</div>
      <div id="help" class="mouse-only" data-i18n="title.help">W／S で前進・後退　A／D で車体を旋回　マウスで照準　クリック／スペースで射撃　Q でピン　Tab で参加者一覧　M で消音　Esc で部屋を出る</div>
      <div id="helpTouch" class="touch-only" data-i18n="title.helpTouch">左半分をなぞった方向へ車体が向きを変えて進む　右半分をなぞって照準（大きく倒すと自動で射撃）　上のボタンでピン</div>
    </section>
    <section id="lobby" hidden aria-label="ロビー" data-i18n-aria="lobby.aria">
      <div id="lobbyMsg" role="status"></div>
      <div class="row">
        <button class="btn primary" id="quick" type="button" data-i18n="lobby.quick">クイック参加</button>
        <button class="btn" id="create" type="button" data-i18n="lobby.create">部屋を作る</button>
        <form id="codeForm" class="row">
          <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="招待コード" aria-label="招待コード（6桁）" data-i18n-placeholder="lobby.codePlaceholder" data-i18n-aria="lobby.codeAria">
          <button class="btn" type="submit" data-i18n="lobby.joinCode">コードで参加</button>
        </form>
        <button class="btn" id="rejoin" type="button" hidden data-i18n="lobby.rejoin">さっきの部屋に戻る</button>
      </div>
      <form id="createForm" hidden aria-label="部屋を作る" data-i18n-aria="set.formAria">
        <label><span data-i18n="set.mode">モード</span> <select name="mode"><option data-i18n="set.mode.elim" value="elim">殲滅</option><option data-i18n="set.mode.conquest" value="conquest">拠点制圧</option></select></label>
        <label><span data-i18n="set.winRounds">先取ラウンド（殲滅）</span> <select name="winRounds"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
        <label><span data-i18n="set.map">マップ</span> <select name="map"><option data-i18n="set.map.random" value="random" selected>自動生成（128×128）</option><option data-i18n="set.map.basic" value="basic">標準（40×24）</option></select></label>
        <label><span data-i18n="set.seedCreate">シード値（空欄はおまかせ）</span> <input name="mapSeed" type="number" min="0" max="2147483647" inputmode="numeric" placeholder="おまかせ" data-i18n-placeholder="set.seedPlaceholder"></label>
        <label><span data-i18n="set.botLevel">bot の強さ</span> <select name="botLevel"><option value="1" data-i18n="set.level.1">1 入門</option><option value="2" data-i18n="set.level.2">2 初級</option><option value="3" selected data-i18n="set.level.3">3 標準</option><option value="4" data-i18n="set.level.4">4 上級</option><option value="5" data-i18n="set.level.5">5 達人</option></select></label>
        <label><span data-i18n="set.ff">フレンドリーファイア</span> <input type="checkbox" name="ff"></label>
        <label><span data-i18n="set.public">公開（一覧に表示する）</span> <input type="checkbox" name="public" checked></label>
        <div class="row"><button class="btn primary" type="submit" data-i18n="set.submit">作って入る</button><button class="btn" type="button" id="cancelCreate" data-i18n="set.cancel">やめる</button></div>
      </form>
      <div id="humanCheck"></div>
      <ul id="rooms" aria-label="公開部屋の一覧" data-i18n-aria="lobby.roomsAria"></ul>
      <div class="row"><button class="btn" id="back" type="button" data-i18n="lobby.back">名前・戦車を変える</button></div>
    </section>
  </div>
  <div id="touchBar" role="toolbar" aria-label="操作ボタン" data-i18n-aria="touch.aria">
    <button class="btn" type="button" data-act="pin" data-i18n="touch.pin">ピン</button>
    <button class="btn primary" type="button" data-act="start" hidden data-i18n="touch.start">今すぐ開始</button>
    <button class="btn" type="button" data-act="settings" hidden data-i18n="touch.settings">設定</button>
    <button class="btn" type="button" data-act="players" data-i18n="touch.players">参加者</button>
    <button class="btn" type="button" data-act="sound" data-i18n="touch.soundOn">音：オン</button>
    <button class="btn" type="button" data-act="leave" data-i18n="touch.leave">退出</button>
  </div>
  <div id="rotate" role="alert"><span data-i18n="rotate.line1">横向きにしてください</span><span data-i18n="rotate.line2">（このゲームは横画面で遊びます）</span></div>
  <div id="players" aria-label="参加者一覧" data-i18n-aria="players.aria">
    <h2 data-i18n="players.title">参加者</h2>
    <div id="invite"></div>
    <ul id="playerList"></ul>
  </div>
  <form id="settings" aria-label="部屋の設定" data-i18n-aria="set.panelAria">
    <h2 data-i18n="set.panelTitle">部屋の設定（部屋主のみ・待機中）</h2>
    <label><span data-i18n="set.mode">モード</span>
      <select name="mode"><option data-i18n="set.mode.elim" value="elim">殲滅</option><option data-i18n="set.mode.conquest" value="conquest">拠点制圧</option></select></label>
    <label><span data-i18n="set.winRounds">先取ラウンド（殲滅）</span>
      <select name="winRounds"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select></label>
    <label><span data-i18n="set.map">マップ</span>
      <select name="map"><option data-i18n="set.map.random" value="random">自動生成（128×128）</option><option data-i18n="set.map.basic" value="basic">標準（40×24）</option></select></label>
    <label><span data-i18n="set.seedPanel">シード値（空欄で新しいマップ）</span>
      <input name="mapSeed" type="number" min="0" max="2147483647" inputmode="numeric" placeholder="おまかせ" data-i18n-placeholder="set.seedPlaceholder"></label>
    <label><span data-i18n="set.botLevel">bot の強さ</span>
      <select name="botLevel"><option value="1" data-i18n="set.level.1">1 入門</option><option value="2" data-i18n="set.level.2">2 初級</option><option value="3" data-i18n="set.level.3">3 標準</option><option value="4" data-i18n="set.level.4">4 上級</option><option value="5" data-i18n="set.level.5">5 達人</option></select></label>
    <label><span data-i18n="set.ff">フレンドリーファイア</span> <input type="checkbox" name="ff"></label>
  </form>
  <script type="module" src="game.js"></script>
</body>
</html>
